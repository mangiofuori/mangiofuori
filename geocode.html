<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controllo indirizzi</title>
<style>body{font:15px system-ui;max-width:760px;margin:0 auto;padding:16px}pre{background:#eee;padding:10px;overflow:auto;white-space:pre-wrap;font-size:12px}.ok{color:#176}.no{color:#a33}button{font-size:16px;padding:12px 18px}</style></head><body>
<h2>Controllo indirizzi</h2><p>Cerca ogni indirizzo su OpenStreetMap e propone le coordinate giuste. Premi il bottone e aspetta (circa 30 secondi).</p>
<button id="go">Avvia</button><div id="out"></div><h3>Da incollare in Supabase (SQL Editor)</h3><pre id="sql">—</pre>
<script>
var out=document.getElementById('out'),sql=[];
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
document.getElementById('go').onclick=async function(){
 var vs=await (await fetch('data/venues.json')).json();
 for(var v of vs){
  var q=v.address.replace(/, Milano$/,'')+(/Milano/.test(v.address)?', Milano':'');
  var p=document.createElement('p');p.textContent=v.name+': cerco…';out.appendChild(p);
  try{
   var r=await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=it&q='+encodeURIComponent(q))).json();
   if(r.length){var lat=(+r[0].lat).toFixed(6),lon=(+r[0].lon).toFixed(6);
    p.className='ok';p.textContent=v.name+' → '+lat+', '+lon+'  ('+r[0].display_name.slice(0,70)+')';
    sql.push("update public.venues set lat="+lat+", lon="+lon+", approx=false where id='"+v.id+"';");}
   else{p.className='no';p.textContent=v.name+': indirizzo non trovato ('+q+')';}
  }catch(e){p.className='no';p.textContent=v.name+': errore di rete';}
  document.getElementById('sql').textContent=sql.join('\n');
  await sleep(1200);
 }
};
</script></body></html>
