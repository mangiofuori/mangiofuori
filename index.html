<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mangio Fuori</title>
<meta name="description" content="Recensioni dei posti dove mangio, sulla mappa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Fraunces:ital,wght@1,900&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="wood" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.18" numOctaves="4" seed="7" result="g"/><feTurbulence type="fractalNoise" baseFrequency="0.01 0.02" numOctaves="2" seed="3" result="w"/><feDisplacementMap in="g" in2="w" scale="40" xChannelSelector="R" yChannelSelector="G" result="d"/><feColorMatrix in="d" type="matrix" values="0 0 0 0 0.19 0 0 0 0 0.10 0 0 0 0 0.04 2.2 0 0 0 -0.7"/></filter>
</defs></svg>

<header class="top">
  <div class="top-in">
    <a class="logo" href="#/">MANGIO FUORI</a>
    <nav>
      <a href="#/mappa" id="nav-mappa">Mappa</a>
      <a href="#/contatti" id="nav-contatti">Contatta l'admin</a>
      <a class="ig" id="ig" target="_blank" rel="noopener" aria-label="Instagram">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D14" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="0.6" fill="#2B1D14"/></svg>
      </a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="wood foot">
  <div class="foot-in"><span class="logo-s">MANGIO FUORI</span><span>Recensioni dei posti dove mangio.</span></div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
